; Configuracao de compilacao e gravacao da planta didatica HVAC.
; Autor: Thiago Miorando Tavolara
; TCC em Engenharia de Controle e Automacao - UFRGS
; Orientacao: Prof. Marcelo Gotz
;
; Alvo desta base: Arduino Nano com ATmega328P e bootloader novo.
; Ao adaptar a placa, selecione o identificador correspondente ao hardware
; e ao bootloader instalados. Essa escolha e independente da taxa da GUI.

[env:nanoatmega328new]
; Versao da plataforma utilizada para compilar o firmware desta base.
platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino

; Dependencia FreeRTOS para AVR obtida pelo gerenciador do PlatformIO.
lib_deps =
    feilipu/FreeRTOS@11.1.0-3

; Taxa do Monitor Serial, igual a Serial.begin no firmware e a taxa da GUI.
monitor_speed = 115200

; Se necessario, informe a porta da placa quando a deteccao automatica falhar.
; upload_port = COM3
